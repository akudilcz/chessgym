name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set — the APK would be debug-signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/chessgym-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=chessgym
          storeFile=${{ github.workspace }}/app/android/chessgym-release.jks
          EOF

      - run: flutter pub get

      - name: Build release APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/chessgym.apk

      - name: Verify the APK is signed with the release key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/chessgym.apk

      - name: Publish rolling "latest" release
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/chessgym.apk \
            --title "Chess Gym $VERSION (build ${{ github.run_number }})" \
            --notes "Latest build from \`main\` (commit ${{ github.sha }}).

          Install: open this page on your Android phone and tap \`chessgym.apk\`, or go straight to
          https://github.com/${{ github.repository }}/releases/latest/download/chessgym.apk

          Android will ask you to allow installs from your browser the first time."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/chessgym.apk \
            --title "Chess Gym ${{ github.ref_name }}" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: chessgym-apk
          path: app/build/chessgym.apk
