name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set — the APK would be debug-signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/chessgym-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=chessgym
          storeFile=${{ github.workspace }}/app/android/chessgym-release.jks
          EOF

      - run: flutter pub get

      - name: Build release APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # One APK per ABI instead of a universal one: a universal build
          # carries all three sets of native libs, ~17 MB of which no single
          # phone can use.
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}"
          OUT=build/app/outputs/flutter-apk
          # arm64 is every Android phone made in the last decade, so it keeps
          # the stable `chessgym.apk` name the install link points at.
          cp "$OUT/app-arm64-v8a-release.apk"   build/chessgym.apk
          cp "$OUT/app-armeabi-v7a-release.apk" build/chessgym-armeabi-v7a.apk
          cp "$OUT/app-x86_64-release.apk"      build/chessgym-x86_64.apk
          ls -l build/*.apk

      - name: Verify the APKs are signed with the release key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Publish rolling "latest" release
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            build/chessgym.apk \
            build/chessgym-armeabi-v7a.apk \
            build/chessgym-x86_64.apk \
            --title "Chess Gym $VERSION (build ${{ github.run_number }})" \
            --notes "Latest build from \`main\` (commit ${{ github.sha }}).

          Install: open this page on your Android phone and tap \`chessgym.apk\`, or go straight to
          https://github.com/${{ github.repository }}/releases/latest/download/chessgym.apk

          \`chessgym.apk\` is the 64-bit ARM build — the right one for any phone made in the last decade.
          The other two are for 32-bit ARM devices and x86_64 emulators.

          Android will ask you to allow installs from your browser the first time."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/chessgym.apk \
            build/chessgym-armeabi-v7a.apk \
            build/chessgym-x86_64.apk \
            --title "Chess Gym ${{ github.ref_name }}" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: chessgym-apk
          path: app/build/*.apk
