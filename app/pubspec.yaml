name: chesspuzzle
description: Curated chess puzzle trainer. Offline, no accounts, no telemetry.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  dartchess: ^0.13.1
  chessground: ^10.1.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  fast_immutable_collections: ^11.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_riverpod: ^3.4.2
  crypto: ^3.0.3
  chesspuzzle_logic:
    path: ../app_logic

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test helpers name the `Override` type, which flutter_riverpod 3 no
  # longer re-exports; it lives in riverpod's misc.dart.
  riverpod: ^3.4.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#0A0E14"
  image: "assets/icon/icon.png"
  android: true
  ios: true
  android_12:
    color: "#0A0E14"
    image: "assets/icon/icon.png"

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/
